<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#130A20">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Watch Transfiguration TV live, read the Prophet’s blog and books, listen to Transfiguration Records and stay close to the Apostolic Gospel Mission family.">
<title>Prophet Kevin Online</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="phone" id="phone">
  <section id="splash" aria-label="Loading">
    <div class="sp-bloom"></div>
    <div class="sp-rings"><i></i><i></i><i></i></div>
    <div class="sp-spark" id="spSpark"></div>
    <div class="sp-stage">
      <svg class="sp-rays" viewBox="-150 -150 300 300" aria-hidden="true"><g id="spRays"></g></svg>
      <div class="sp-logo"><img id="spLogo" alt=""><span class="sp-shine" id="spShine"></span></div>
    </div>
    <h1 class="sp-word" id="spWord"></h1>
    <p class="sp-tag">Apostolic Gospel Mission</p>
    <div class="sp-foot">Home of <b>Transfiguration TV</b></div>
  </section>

  <section id="onboard" hidden>
    <div class="ob-brand" id="obBrand"></div>
    <button class="ob-skip" id="obSkip">Skip</button>
    <div class="ob-track" id="obTrack"></div>
    <div class="ob-bar">
      <div class="ob-dots" id="obDots"></div>
      <button class="ob-next" id="obNext">Next</button>
    </div>
  </section>

  <section id="shell" hidden>
    <main class="main" id="main"></main>
    <header class="topbar" id="topbar"></header>
    <div class="mini" id="mini" hidden></div>
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    <div id="pages"></div>
    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" aria-label="Menu"></aside>
    <div class="scrim2" id="scrim2"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </section>
</div>
<noscript>Please enable JavaScript to use Prophet Kevin Online.</noscript>
</body>
</html>
