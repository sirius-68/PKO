# Builds a DEMO Android APK (bundled content, no backend, no real sign-in) and
# publishes it as the "android-demo" release so it can be installed for a preview.
name: Android demo APK
on:
  push:
    branches: [main, feat/cross-platform-rebuild]
    paths: ['src/**', 'app/**', 'admin/seed/**', 'capacitor.config.json', 'package.json', 'scripts/**', '.github/workflows/android-demo.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build demo APK
        run: |
          set -o pipefail
          {
            set -ex
            npm install --no-audit --no-fund
            npm run build
            DEMO=1 node scripts/write-config.mjs
            node scripts/build-demo.mjs
            # Capacitor's JS runtime wires the native plugins (back button, share, haptics, notifications…)
            CAP_JS=$(ls node_modules/@capacitor/core/dist/capacitor.js 2>/dev/null || true)
            if [ -n "$CAP_JS" ]; then
              cp "$CAP_JS" app/capacitor.js
              sed -i 's#<script src="config.js"></script>#<script src="capacitor.js"></script>\n<script src="config.js"></script>#' app/index.html
            else
              echo "capacitor.js runtime not found; the app will use web fallbacks"
              ls node_modules/@capacitor/core/dist || true
            fi
            npx cap add android
            npx capacitor-assets generate --android --iconBackgroundColor "#1E0D33" --splashBackgroundColor "#130A20" --assetPath app/icons
            npx cap sync android
            cd android
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../prophet-kevin-online-demo.apk
          } 2>&1 | tee build.log
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete android-demo --yes --cleanup-tag || true
          gh release delete android-demo-build-log --yes --cleanup-tag || true
          gh release create android-demo prophet-kevin-online-demo.apk --prerelease --target "$GITHUB_SHA" \
            --title "Android demo app (${GITHUB_SHA::7})" \
            --notes "Preview build of the Prophet Kevin Online member app. All content is built in and your activity (sign-in name, Amens, comments, chat) stays on the phone — no server, no real accounts. Install: download the APK on an Android phone, open it, and allow installing from this source."
      - name: Publish the build log if something failed
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete android-demo-build-log --yes --cleanup-tag || true
          tail -c 120000 build.log > build-tail.log || echo "no log" > build-tail.log
          gh release create android-demo-build-log build-tail.log --prerelease --target "$GITHUB_SHA" --title "Android demo build failed (${GITHUB_SHA::7})" --notes "See build-tail.log."
